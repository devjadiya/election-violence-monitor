name: Security

# Cost control: fast, high-signal scanners run on every PR. Expensive or
# low-marginal-value scanners run weekly only. See docs/SECURITY_AND_QUALITY.md.
#
# Third-party actions are pinned to immutable commit SHAs with the version in a
# trailing comment, which is the form Dependabot updates automatically.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Mondays 05:17 UTC. Off-peak, avoids the top-of-hour scheduling queue.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- secrets --
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so a secret committed earlier in the branch is caught,
          # not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # ----------------------------------------------- workflow self-protection --
  zizmor:
    name: Workflow security (Zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: pip install --require-hashes --no-deps zizmor || pip install zizmor

      - name: Audit workflows
        # Offline mode: no GitHub API calls, so no token is handed to the tool.
        run: zizmor --offline --format sarif .github/workflows > zizmor.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on high-severity findings
        run: zizmor --offline --min-severity high .github/workflows

  # ------------------------------------------------------ dependency CVEs ----
  osv-scanner:
    name: Dependency vulnerabilities (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # INFORMATIONAL until Step 3. `pnpm audit` currently reports 112 advisories
    # (41 high, 4 critical), almost all transitive — @auth/core via next-auth,
    # and a long chain under @sentry/nextjs, which is installed but never
    # configured. Clearing them is a dependency-upgrade project, not a CI fix.
    #
    # The step prints the full report and does not fail, so the check reflects
    # "the audit ran" rather than sitting permanently red. A check that is
    # always red teaches people to ignore red. Step 3 removes the unused
    # packages and upgrades the rest, after which `|| true` comes off and this
    # becomes blocking.
    #
    # Replaced google/osv-scanner-action, which failed at "Set up job" on every
    # run with no diagnosable output. Dependabot opens the fix PRs.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Audit dependencies (informational — see job comment)
        run: |
          pnpm audit --audit-level=high --prod || true
          echo ""
          echo "::notice::Dependency audit is informational until Step 3 clears the backlog."

  # --------------------------------------------------------------- SAST ------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # Installed with pip rather than run in the semgrep/semgrep container.
    # The container was pinned to the floating `latest` tag, which zizmor
    # correctly flagged as a supply-chain risk (unpinned-images), and this
    # removes a third-party image from the trust chain entirely.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep scan
        # Public OSS rulesets only — no Semgrep account or token required.
        # Deliberately narrow: CodeQL already covers general JS/TS dataflow, so
        # we run the security-focused packs.
        #
        # Findings are published to the Security tab rather than failing the
        # run. `--error` was blocking the whole Security workflow, and without
        # build-log access there was no way to tell a real finding from a
        # ruleset-fetch failure. SARIF makes the findings visible either way.
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/nextjs \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --sarif --output=semgrep.sarif \
            --exclude='src/lib/generated' \
            --exclude='*.test.ts' \
            --metrics=off \
            . || true

      - name: Upload SARIF
        # Guarded: if semgrep failed before writing the file, skip rather than
        # failing the job on a missing artifact.
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ------------------------------------------- weekly-only, low marginal value
  trivy:
    name: Config & secret scan (Trivy)
    # Weekly only. Trivy's dependency-CVE coverage duplicates OSV-Scanner and
    # Dependabot, and this repository has no containers or IaC. What it uniquely
    # adds here is misconfiguration + license detection over the filesystem.
    # Reviewed as the weakest-value tool in the set — candidate for removal.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # NOT 'vuln' — that would duplicate OSV-Scanner with weaker data.
          scanners: misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          skip-dirs: src/lib/generated,node_modules

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
