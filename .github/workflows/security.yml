name: Security

# Cost control: fast, high-signal scanners run on every PR. Expensive or
# low-marginal-value scanners run weekly only. See docs/SECURITY_AND_QUALITY.md.
#
# Third-party actions are pinned to immutable commit SHAs with the version in a
# trailing comment, which is the form Dependabot updates automatically.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Mondays 05:17 UTC. Off-peak, avoids the top-of-hour scheduling queue.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- secrets --
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a secret committed earlier in the branch is caught,
          # not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # ----------------------------------------------- workflow self-protection --
  zizmor:
    name: Workflow security (Zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: pip install --require-hashes --no-deps zizmor || pip install zizmor

      - name: Audit workflows
        # Offline mode: no GitHub API calls, so no token is handed to the tool.
        run: zizmor --offline --format sarif .github/workflows > zizmor.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on high-severity findings
        run: zizmor --offline --min-severity high .github/workflows

  # ------------------------------------------------------ dependency CVEs ----
  osv-scanner:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
            --format=sarif
            --output=osv.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # --------------------------------------------------------------- SAST ------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Semgrep scan
        # Public OSS rulesets only — no Semgrep account or token required.
        # Deliberately narrow: CodeQL already covers general JS/TS dataflow, so
        # we run the security-focused packs and fail only on ERROR severity.
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/nextjs \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --error \
            --exclude='src/lib/generated' \
            --exclude='*.test.ts' \
            --metrics=off \
            .

  # ------------------------------------------- weekly-only, low marginal value
  trivy:
    name: Config & secret scan (Trivy)
    # Weekly only. Trivy's dependency-CVE coverage duplicates OSV-Scanner and
    # Dependabot, and this repository has no containers or IaC. What it uniquely
    # adds here is misconfiguration + license detection over the filesystem.
    # Reviewed as the weakest-value tool in the set — candidate for removal.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # NOT 'vuln' — that would duplicate OSV-Scanner with weaker data.
          scanners: misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          skip-dirs: src/lib/generated,node_modules

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
