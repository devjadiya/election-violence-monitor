<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Election Violence Monitor">
  <!-- The same mark as the site header: three rules of decreasing length, the
       funnel from published reporting to a published record. Replaces an "EV"
       monogram drawn in #1a1a2e, a colour retired from the design system. -->
  <rect width="32" height="32" rx="7" fill="#10263f"/>
  <rect x="7" y="9" width="18" height="2.6" rx="1.3" fill="#ffffff" opacity="0.95"/>
  <rect x="7" y="14.7" width="12.5" height="2.6" rx="1.3" fill="#ffffff" opacity="0.7"/>
  <rect x="7" y="20.4" width="7.5" height="2.6" rx="1.3" fill="#ffffff" opacity="0.45"/>
</svg>
